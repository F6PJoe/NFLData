name: Weekly rankings (half PPR)

# Run the half-PPR weekly rankings on demand -- built to be triggered from
# Joe's phone (GitHub app -> Actions -> Run workflow). Same per-position source
# lists as a local run; the 7 paste lists go to Dropbox as one headerless CSV
# each ("Week N/1 FLX.csv" ... "7 DST.csv") for Excel mobile.
#
# The workflow file lives on main (GitHub only lists workflow_dispatch
# workflows from the default branch) but always runs the code on the
# phone-rankings branch -- see the checkout step.
#
# Deliberately leaves nothing in this PUBLIC repo: no commit, no artifact, no
# job summary -- the rankings only ever reach Joe's Dropbox.
#
# Differences from a local run: Jahnke's PFF cache/full export lives only on
# Joe's PC (*.json is gitignored), so here he counts only through his FP board;
# and no site export is kept.

on:
  workflow_dispatch:
    inputs:
      gate:
        description: 'strict = honour the freshness cutoff; off = take every board'
        type: choice
        options: [strict, off]
        default: strict
      ftn:
        description: 'Try FTN (Ratcliffe/Tyler O). Untick when FTN is blocking GitHub -- they then count only if they have posted to FP.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: weekly-rankings-half
  cancel-in-progress: true

jobs:
  rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The rankings code comes from the phone-rankings branch, not from
      # whatever triggered the run: Joe updates that branch only when he's
      # happy with a version, so work in progress on main never reaches it.
      - name: Check out the phone-rankings branch
        uses: actions/checkout@v4
        with:
          ref: phone-rankings
          sparse-checkout: ff_rankings

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ff_rankings/requirements.txt

      - name: Install dependencies
        run: pip install -r ff_rankings/requirements.txt

      - name: Build half-PPR rankings
        working-directory: ff_rankings
        env:
          FTN_EMAIL: ${{ secrets.FTN_EMAIL }}
          FTN_PASSWORD: ${{ secrets.FTN_PASSWORD }}
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: >
          python run_weekly.py --scoring HALF --gate "${{ inputs.gate }}"
          ${{ !inputs.ftn && '--no-ftn' || '' }}

      - name: Upload paste lists to Dropbox
        working-directory: ff_rankings
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: python upload_dropbox.py
