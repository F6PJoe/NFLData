name: Defense Stream-O-Matic - Frequent Refresh
#
# The MID-WEEK run: Wednesday morning through Sunday, as often as Joe
# wants. Only the columns that actually move day to day -- live odds,
# Yahoo roster/start%/projection, FantasyPros ECR -- then re-score and
# re-sort.
#
# Everything else is deliberately Tuesday-only and lives in
# defense_full_refresh.yml: the team list and matchups (opponents don't
# change once the slate is set), Def Rating and Opp Off EPA (refreshing
# mid-week would fold in Thursday night's game for 2 teams and nobody
# else -- see run_frequent.py's docstring), and pressure rate.
#
# ORDER MATTERS between the two workflows: the Tuesday full refresh has to
# land first each week, because it's what writes the team list in column B
# that every push here matches its rows against. If this runs first on a
# Wednesday, it refreshes LAST week's teams.
#
# Needs NO login credentials beyond the odds API key and the Google
# service account -- everything self-owned comes from nflverse's public
# release files.
#
# No native `schedule:` trigger, matching every other workflow in this
# repo -- GitHub's own scheduler has been unreliable here before. Wire
# this up via cron-job.org (workflow_dispatch) for the actual Wed-Sun
# cadence Joe wants; do NOT add a `schedule:` trigger here without
# checking cron-job.org first, or this could double-run.
#
# --week is optional -- omit it to auto-detect from today's date
# (current_week.py), which is what a scheduled/unattended trigger should
# do, since there's no one there to type it in.

on:
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week (leave blank to auto-detect from today's date)"
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r ff_defense/requirements.txt

      - name: Write credentials
        env:
          ODDS_API_KEY:           ${{ secrets.ODDS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          cat > ff_defense/.env <<EOF
          ODDS_API_KEY=${ODDS_API_KEY}
          EOF

          # Service account JSON goes at the repo root -- every ff_defense
          # script points at Path(__file__).parent.parent for it.
          echo "${GOOGLE_SERVICE_ACCOUNT}" > triple-baton-456523-e4-b9ec3cbd6e3d.json

      - name: Run frequent refresh
        working-directory: ff_defense
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            python run_frequent.py --week "${{ github.event.inputs.week }}"
          else
            python run_frequent.py
          fi

      - name: Upload CSVs as artifact (optional — for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defense-frequent-refresh-csvs
          path: 'ff_defense/*.csv'
          retention-days: 7
