<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-alt: #cccccc;
    --ink: #262625;
    --ink-soft: #6b6862;
    --ink-faint: #8a8a8a;
    --line: #d8d8d8;
    --accent: #cc5e03;
    --accent-ink: #ffffff;
    --qb: #ef74a1cc;
    --rb: #8ff2cacc;
    --wr: #56c9f8cc;
    --te: #feae58cc;
    --pos-ink: #000000;
    --radius: 3px;
    --shadow: 0 1px 2px rgba(28, 35, 31, 0.06), 0 6px 20px rgba(28, 35, 31, 0.05);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 40px 24px 64px;
  }

  .panel {
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 22px;
  }

  .control-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    align-items: end;
  }

  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 6px;
  }

  select, input[type="number"] {
    width: 100%;
    font: inherit;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 9px 10px;
    font-variant-numeric: tabular-nums;
  }

  select:focus, input:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button.load {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    padding: 10px 18px;
    cursor: pointer;
    transition: filter 0.12s ease;
  }
  button.load:hover { filter: brightness(1.08); }
  button.load:active { filter: brightness(0.94); }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .pos-filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .pos-pill {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .pos-pill[data-active="true"] {
    color: var(--accent-ink);
    border-color: transparent;
  }
  .pos-pill[data-pos="ALL"][data-active="true"] { background: var(--ink); }
  .pos-pill[data-pos="QB"][data-active="true"] { background: var(--qb); color: var(--pos-ink); }
  .pos-pill[data-pos="RB"][data-active="true"] { background: var(--rb); color: var(--pos-ink); }
  .pos-pill[data-pos="WR"][data-active="true"] { background: var(--wr); color: var(--pos-ink); }
  .pos-pill[data-pos="TE"][data-active="true"] { background: var(--te); color: var(--pos-ink); }

  .search-print {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  input[type="search"] {
    font: inherit;
    font-size: 13.5px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    width: 180px;
  }

  button.print-btn {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 7px 13px;
    cursor: pointer;
  }
  button.print-btn:hover { background: var(--surface-alt); }

  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }

  thead th {
    position: sticky;
    top: 0;
    background: var(--accent);
    text-align: left;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent-ink);
    font-weight: 700;
    padding: 11px 14px;
    border-bottom: 1px solid var(--accent);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover { filter: brightness(1.08); }
  thead th .arrow { font-size: 9px; margin-left: 3px; opacity: 0.6; }

  tbody td {
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    white-space: nowrap;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) { background: color-mix(in srgb, var(--surface-alt) 40%, transparent); }

  td.rank { color: var(--ink-faint); font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace; font-size: 12.5px; width: 36px; }
  td.player { font-weight: 600; }
  td.team { color: var(--ink-soft); font-size: 12.5px; }
  td.points, td.value { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace; text-align: right; }
  td.value { font-weight: 700; color: var(--accent); }

  .pos-chip {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 2px 7px;
    border-radius: 999px;
    color: var(--pos-ink);
  }
  .pos-chip.QB { background: var(--qb); }
  .pos-chip.RB { background: var(--rb); }
  .pos-chip.WR { background: var(--wr); }
  .pos-chip.TE { background: var(--te); }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 14px;
  }

  .scroll-hint {
    display: none;
    margin: 0 0 8px;
    font-size: 12.5px;
    color: var(--ink-faint);
    text-align: center;
  }

  @media (max-width: 720px) {
    .wrap { padding-left: 10px; padding-right: 10px; }
    .control-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .toolbar { flex-direction: column; align-items: stretch; }
    .search-print { justify-content: space-between; }

    /* Value (the whole point of this page) was getting scrolled off-screen
       by default on a phone -- only #/Player/Team fit in ~375px at the
       desktop padding/font sizes. Tighter padding and a couple of
       ID-column shortcuts get Value into view without scrolling for most
       phones; the hint above covers the rest, since mobile browsers hide
       scrollbars by default and give no other visual clue the table
       scrolls sideways. */
    .scroll-hint { display: block; }
    thead th { padding: 9px 5px; font-size: 11px; }
    tbody td { padding: 7px 5px; font-size: 13px; }
    td.rank { width: 18px; }
    td.team { font-size: 11.5px; }
    .pos-chip { padding: 2px 5px; }
    /* Proj. Pts is reference info, not this page's actual point (Value
       is) -- hidden on phones specifically so Value fits without a
       scroll, verified against real measurements (375px viewport) rather
       than assumed: hiding it plus this tighter padding was needed
       together, hiding it alone still left Value ~44px short. */
    th[data-key="points"], td.points { display: none; }
  }

  @media (max-width: 440px) {
    /* The 720px tier above was verified in an isolated test page and fit
       fine there, but the real WordPress theme's own container padding/
       fonts around the embedded chart eat into usable width beyond what
       an isolated test can see -- confirmed against the real live page,
       not assumed: still cut off on a real 412px phone despite fitting
       cleanly at 457px and up in the same testing session. Rather than
       chase the exact discrepancy, drop Team too (Player is enough
       context most of the time; Team is the least essential of what's
       left) on the narrowest phones specifically, so there's real margin
       instead of another razor-thin fit.

       table-layout switches to fixed with percentage widths here rather
       than just tightening padding further -- `max-width` on a <td> is
       silently ignored under the default `table-layout: auto` (columns
       size to content, not to any cap you set), confirmed directly: an
       earlier attempt at capping Player's width this way barely moved
       the numbers. Percentage widths under `fixed` layout are a real,
       deterministic cap regardless of how long any single player's name
       is, instead of another content-dependent guess that could still
       come up short for a longer name than whatever happened to be in
       the test data. */
    table { table-layout: fixed; }
    th[data-key="team"], td.team { display: none; }
    th[data-key="rank"], td.rank { width: 8%; padding-left: 3px; padding-right: 3px; }
    th[data-key="name"], td.player { width: 52%; overflow: hidden; text-overflow: ellipsis; }
    th[data-key="position"], td:has(.pos-chip) { width: 18%; }
    th[data-key="value"], td.value { width: 22%; padding-left: 3px; padding-right: 6px; }
    thead th { padding-top: 8px; padding-bottom: 8px; }
    tbody td { padding-top: 6px; padding-bottom: 6px; }
  }

  @media print {
    body { background: #fff; color: #000; }
    .panel.controls, .toolbar { display: none; }
    .wrap { padding: 0; max-width: none; }
    .table-scroll { border: none; }
    thead th { position: static; background: #fff; color: #000; border-bottom: 1.5px solid #000; }
    tbody tr:nth-child(even) { background: #f4f4f4; }
    td.value { color: #000; }
    .pos-chip { color: #000; background: none !important; border: 1px solid #000; }
  }
</style>

<div class="wrap">
  <section class="panel controls">
    <div class="control-grid">
      <div class="field">
        <label for="sel-teams">Teams</label>
        <select id="sel-teams"></select>
      </div>
      <div class="field">
        <label for="sel-format">Scoring Format</label>
        <select id="sel-format"></select>
      </div>
      <div class="field">
        <label for="inp-budget">Budget per Team ($)</label>
        <input type="number" id="inp-budget" min="15" max="1000" step="1" value="200" />
      </div>
      <div class="field">
        <button class="load" id="btn-load" type="button">Load Values</button>
      </div>
    </div>
  </section>

  <div class="toolbar">
    <div class="pos-filters" id="pos-filters">
      <button class="pos-pill" data-pos="ALL" data-active="true" type="button">All</button>
      <button class="pos-pill" data-pos="QB" data-active="true" type="button">QB</button>
      <button class="pos-pill" data-pos="RB" data-active="true" type="button">RB</button>
      <button class="pos-pill" data-pos="WR" data-active="true" type="button">WR</button>
      <button class="pos-pill" data-pos="TE" data-active="true" type="button">TE</button>
    </div>
    <div class="search-print">
      <input type="search" id="inp-search" placeholder="Find a player&hellip;" />
      <button class="print-btn" id="btn-print" type="button">Print</button>
    </div>
  </div>

  <p class="scroll-hint">&larr; Swipe table to see Pos / Pts / Value &rarr;</p>
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th data-key="rank">#</th>
          <th data-key="name">Player</th>
          <th data-key="team">Team</th>
          <th data-key="position">Pos</th>
          <th data-key="points">Proj. Pts</th>
          <th data-key="value">Value</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none;">No players match the current filters.</div>
  </div>
</div>

<script type="text/javascript">
jQuery(document).ready(function($){
  const DATA = /*__DATA_PLACEHOLDER__*/;

  const FORMAT_LABEL = { std: "Standard", half_ppr: "Half PPR", ppr: "Full PPR" };

  const selTeams = document.getElementById("sel-teams");
  const selFormat = document.getElementById("sel-format");
  const inpBudget = document.getElementById("inp-budget");
  const btnLoad = document.getElementById("btn-load");
  const btnPrint = document.getElementById("btn-print");
  const inpSearch = document.getElementById("inp-search");
  const tableBody = document.getElementById("table-body");
  const emptyState = document.getElementById("empty-state");
  const posFilters = document.getElementById("pos-filters");

  DATA.teamCounts.forEach((t) => {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t + " Teams";
    if (t === 12) opt.selected = true;
    selTeams.appendChild(opt);
  });

  DATA.formats.forEach((f) => {
    const opt = document.createElement("option");
    opt.value = f;
    opt.textContent = FORMAT_LABEL[f] || f;
    if (f === "half_ppr") opt.selected = true;
    selFormat.appendChild(opt);
  });

  let currentPlayers = [];
  let sortKey = "value";
  let sortDir = -1;
  let activePositions = new Set(["QB", "RB", "WR", "TE"]);

  function pointsAtRank(curve, rank) {
    const n = curve.length;
    if (rank <= 1) return curve[0];
    if (rank >= n) return curve[n - 1];
    const floorR = Math.floor(rank);
    const frac = rank - floorR;
    const lo = curve[floorR - 1];
    const hi = curve[floorR];
    return lo + frac * (hi - lo);
  }

  function computeValues(teams, fmt, budget) {
    const cal = DATA.calibrated[teams + "|" + fmt];
    if (!cal) return null;
    const positions = ["QB", "RB", "WR", "TE"];
    const playersByPos = DATA.playersByFormat[fmt];
    const c = DATA.constants;

    const sorted = {};
    positions.forEach((pos) => {
      sorted[pos] = playersByPos[pos].slice().sort((a, b) => b.points - a.points);
    });

    const replacementPoints = {};
    positions.forEach((pos) => {
      const curve = sorted[pos].map((p) => p.points);
      replacementPoints[pos] = pointsAtRank(curve, cal.ranks[pos]);
    });

    const totalMoney = teams * budget;
    const startersTotal = Object.values(c.starters).reduce((a, b) => a + b, 0);
    const totalRosterSpots = teams * (startersTotal + c.flexSlots + c.benchSpots + c.nonSkillSlotsPerTeam);
    const discretionary = totalMoney - totalRosterSpots * 1;

    const allPlayers = [];
    const totalWeightedVorp = { QB: 0, RB: 0, WR: 0, TE: 0 };
    positions.forEach((pos) => {
      sorted[pos].forEach((p) => {
        const vorp = Math.max(0, p.points - replacementPoints[pos]);
        const wvorp = vorp > 0 ? Math.pow(vorp, cal.exponents[pos]) : 0;
        allPlayers.push({ name: p.name, team: p.team, position: pos, points: p.points, weightedVorp: wvorp });
        totalWeightedVorp[pos] += wvorp;
      });
    });

    const dollarPerWvorp = {};
    positions.forEach((pos) => {
      dollarPerWvorp[pos] = (discretionary * cal.budgetShare[pos]) / totalWeightedVorp[pos];
    });

    allPlayers.forEach((p) => {
      p.value = Math.round(1 + p.weightedVorp * dollarPerWvorp[p.position]);
    });

    allPlayers.sort((a, b) => b.value - a.value);
    allPlayers.forEach((p, i) => (p.rank = i + 1));
    return allPlayers;
  }

  function render() {
    const query = inpSearch.value.trim().toLowerCase();
    let rows = currentPlayers.filter((p) => activePositions.has(p.position));
    if (query) rows = rows.filter((p) => p.name.toLowerCase().includes(query) || p.team.toLowerCase().includes(query));

    rows = rows.slice().sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (typeof av === "string") return av.localeCompare(bv) * sortDir;
      return (av - bv) * sortDir;
    });

    tableBody.innerHTML = "";
    emptyState.style.display = rows.length ? "none" : "block";
    const frag = document.createDocumentFragment();
    function addCell(row, className, text) {
      const td = document.createElement("td");
      if (className) td.className = className;
      td.textContent = text;
      row.appendChild(td);
      return td;
    }

    rows.forEach((p) => {
      const tr = document.createElement("tr");
      addCell(tr, "rank", p.rank);
      addCell(tr, "player", p.name);
      addCell(tr, "team", p.team);

      const posTd = document.createElement("td");
      const chip = document.createElement("span");
      chip.className = "pos-chip " + p.position;
      chip.textContent = p.position;
      posTd.appendChild(chip);
      tr.appendChild(posTd);

      addCell(tr, "points", p.points.toFixed(1));
      addCell(tr, "value", "$" + p.value);
      frag.appendChild(tr);
    });
    tableBody.appendChild(frag);

    document.querySelectorAll("thead th[data-key]").forEach((th) => {
      const key = th.dataset.key;
      th.textContent = th.textContent.replace(/\s*[▲▼]$/, "");
      if (key === sortKey) {
        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = sortDir === 1 ? "▲" : "▼";
        th.appendChild(document.createTextNode(" "));
        th.appendChild(arrow);
      }
    });
  }

  function load() {
    const teams = parseInt(selTeams.value, 10);
    const fmt = selFormat.value;
    const budget = Math.max(15, Math.min(1000, parseInt(inpBudget.value, 10) || 200));
    inpBudget.value = budget;
    const players = computeValues(teams, fmt, budget);
    if (!players) {
      currentPlayers = [];
      render();
      return;
    }
    currentPlayers = players;
    render();
  }

  btnLoad.addEventListener("click", load);
  inpSearch.addEventListener("input", render);
  btnPrint.addEventListener("click", () => window.print());

  posFilters.addEventListener("click", (e) => {
    const btn = e.target.closest(".pos-pill");
    if (!btn) return;
    const pos = btn.dataset.pos;
    if (pos === "ALL") {
      activePositions = new Set(["QB", "RB", "WR", "TE"]);
    } else {
      if (activePositions.has(pos) && activePositions.size === 1) {
        activePositions = new Set(["QB", "RB", "WR", "TE"]);
      } else if (activePositions.size === 4) {
        activePositions = new Set([pos]);
      } else if (activePositions.has(pos)) {
        activePositions.delete(pos);
      } else {
        activePositions.add(pos);
      }
    }
    posFilters.querySelectorAll(".pos-pill").forEach((p) => {
      const isAll = p.dataset.pos === "ALL";
      p.dataset.active = isAll ? activePositions.size === 4 : activePositions.has(p.dataset.pos);
    });
    render();
  });

  document.querySelectorAll("thead th[data-key]").forEach((th) => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1;
      else { sortKey = key; sortDir = key === "name" || key === "team" || key === "position" ? 1 : -1; }
      render();
    });
  });

  load();
});
</script>
